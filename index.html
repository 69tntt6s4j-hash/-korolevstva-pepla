<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15170f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Королевства Пепла">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Королевства Пепла II</title>
<style>
:root{--bg:#11140d;--panel:#202619;--panel2:#2a3020;--line:#536047;--gold:#d7ad54;--text:#f4ecd8;--muted:#b8b09c;--red:#9e5041;--blue:#58728c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:radial-gradient(circle at 50% 0,#28301e,#11140d 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit}.app{max-width:1000px;margin:auto}.bar{display:flex;gap:6px;overflow:auto;padding:3px 0 8px}.res{white-space:nowrap;background:linear-gradient(#303724,#202619);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:13px;box-shadow:inset 0 1px rgba(255,255,255,.06)}
.panel{background:linear-gradient(180deg,rgba(42,48,32,.97),rgba(29,35,23,.97));border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.world{position:relative;overflow:auto;border-radius:12px}.map{display:grid;grid-template-columns:repeat(12,48px);grid-auto-rows:48px;gap:1px;width:max-content;background:#15180f;padding:4px;border-radius:10px}
.tile{position:relative;border:0;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#455b2c;overflow:hidden}.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 45%,rgba(0,0,0,.12));pointer-events:none}.tile.water{background:#304b54}.tile.road{background:#685c3e}.tile.rock{background:#4d5045}.tile.fog{filter:brightness(.25) saturate(.4)}.tile.hero{outline:3px solid var(--gold);z-index:2}.tile.target{box-shadow:inset 0 0 0 2px #e8c76e}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) 280px}}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#303725;padding:9px 12px}.btn.gold{background:#57431d;border-color:#947330}.btn.red{background:#512c26;border-color:#7c443a}.btn:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;gap:10px}.small{font-size:13px;color:var(--muted)}.title{font-weight:800;margin-bottom:7px}.log{font-size:12px;line-height:1.35;max-height:120px;overflow:auto}.hidden{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{flex:1}.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.building{padding:9px;border:1px solid var(--line);border-radius:10px;background:#2c3323;text-align:left}.built{border-color:#a88643}
.army{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.unit{background:#2c3323;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}.unit .ico{font-size:26px}.xp{height:6px;background:#15180f;border-radius:6px;overflow:hidden;margin-top:5px}.xp>i{display:block;height:100%;background:var(--gold)}
.modal{position:absolute;inset:4px;background:rgba(13,15,10,.96);z-index:5;border-radius:10px;padding:10px;overflow:auto}.battlefield{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:9px 0}.hex{aspect-ratio:1;border:1px solid #5c654e;border-radius:10px;background:#303827;display:flex;align-items:center;justify-content:center;font-size:20px}.hex.enemy{background:#4b2925}.hex.friend{background:#293b48}.quest{border-left:3px solid var(--gold);padding-left:8px;margin:7px 0}
</style></head>
<body><main class="app">
<div class="bar"><span class="res">💰 <b id="gold"></b></span><span class="res">🪵 <b id="wood"></b></span><span class="res">🪨 <b id="ore"></b></span><span class="res">💎 <b id="gems"></b></span><span class="res">📅 День <b id="day"></b></span><span class="res">⚡ <b id="moves"></b></span></div>
<div class="grid2"><section>
<div class="panel world"><div id="map" class="map"></div>
<div id="battle" class="modal hidden">
 <div class="row"><b>⚔️ Тактическая битва</b><span id="round" class="small"></span></div>
 <div id="battleInfo" class="small"></div><div id="field" class="battlefield"></div>
 <div class="actions"><button id="attack" class="btn gold">⚔️ Атака</button><button id="spell" class="btn">🔥 Огненный шар</button><button id="defend" class="btn">🛡️ Оборона</button><button id="retreat" class="btn red">Отступить</button></div>
</div></div>
<div class="actions"><button id="end" class="btn gold">Завершить день</button><button id="town" class="btn">🏰 Город</button><button id="save" class="btn">💾 Сохранить</button></div>
<div id="townPanel" class="panel hidden" style="margin-top:8px">
 <div class="tabs"><button class="btn tab gold" data-tab="build">Строительство</button><button class="btn tab" data-tab="recruit">Найм</button></div>
 <div id="buildPane"><div class="shop" id="buildings"></div></div>
 <div id="recruitPane" class="hidden"><div class="shop" id="recruits"></div></div>
</div>
</section><aside>
<div class="panel"><div class="title">🧙 Арден, рыцарь</div><div class="row"><span>⚔️ Атака</span><b id="atk"></b></div><div class="row"><span>🛡️ Защита</span><b id="def"></b></div><div class="row"><span>✨ Сила магии</span><b id="magic"></b></div><div class="row"><span>📖 Знания</span><b id="knowledge"></b></div><div class="small">Уровень <b id="level"></b> · опыт <b id="xp"></b></div><div class="xp"><i id="xpbar"></i></div></div>
<div class="panel" style="margin-top:8px"><div class="title">Армия</div><div class="army"><div class="unit"><div class="ico">🗡️</div><b id="pikes"></b><div class="small">Копейщики</div></div><div class="unit"><div class="ico">🏹</div><b id="bows"></b><div class="small">Стрелки</div></div><div class="unit"><div class="ico">🐎</div><b id="cavs"></b><div class="small">Рыцари</div></div></div></div>
<div class="panel" style="margin-top:8px"><div class="title">Задания</div><div id="quests"></div></div>
<div class="panel" style="margin-top:8px"><div class="title">Журнал</div><div id="log" class="log"></div></div>
</aside></div></main>
<script>
(()=>{const W=12,H=10,$=x=>document.getElementById(x),K=(x,y)=>x+','+y;
const baseObjs={'1,1':{t:'town',i:'🏰'},'3,1':{t:'gold',i:'💰',v:600},'5,1':{t:'mine',i:'⛏️'},'6,2':{t:'enemy',i:'👺',n:'Гоблины',hp:95,p:20,r:650,xp:55},'9,2':{t:'artifact',i:'🗡️',n:'Меч Стража'},'2,5':{t:'wood',i:'🪵',v:5},'4,5':{t:'enemy',i:'🐺',n:'Волчьи всадники',hp:145,p:29,r:850,xp:80},'8,5':{t:'gems',i:'💎',v:3},'10,7':{t:'enemy',i:'💀',n:'Некромант',hp:230,p:42,r:1500,xp:140,boss:true},'6,8':{t:'shrine',i:'🔮'},'2,8':{t:'ore',i:'🪨',v:5}};
let s;
function fresh(){s={x:1,y:1,gold:1800,wood:10,ore:8,gems:2,day:1,moves:12,atk:2,def:2,magic:1,knowledge:1,level:1,xp:0,pikes:22,bows:9,cavs:0,mana:10,objs:structuredClone(baseObjs),seen:[],build:{hall:true,barracks:false,range:false,stable:false,mage:false},mine:false,battle:null,quest:{mine:false,boss:false}};reveal();write('Новый поход начался. Захвати шахту и уничтожь Некроманта.');render()}
function persist(){localStorage.setItem('ash-v2',JSON.stringify(s))}
function restore(){try{let q=JSON.parse(localStorage.getItem('ash-v2'));if(q){s=q;return true}}catch(e){}return false}
function write(t){let d=document.createElement('div');d.textContent='• '+t;$('log').prepend(d)}
function reveal(){let set=new Set(s.seen);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){let x=s.x+dx,y=s.y+dy;if(x>=0&&y>=0&&x<W&&y<H)set.add(K(x,y))}s.seen=[...set]}
function terrain(x,y){if(y===3&&x>6)return['water','🌊'];if((x+y)%11===0)return['rock','⛰️'];if((x===1&&y<6)||(y===5&&x<8))return['road','▫️'];return['',''+(['🌲','🌳','🌿','🌾','🍂'][(x*5+y*3)%5])]}
function render(){['gold','wood','ore','gems','day','moves','atk','def','magic','knowledge','level','xp','pikes','bows','cavs'].forEach(k=>$(k).textContent=s[k]);$('xpbar').style.width=Math.min(100,(s.xp/(s.level*100))*100)+'%';let m=$('map');m.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let b=document.createElement('button');b.className='tile';let [cl,ti]=terrain(x,y);if(cl)b.classList.add(cl);let seen=s.seen.includes(K(x,y)),o=s.objs[K(x,y)];if(!seen)b.classList.add('fog');if(x===s.x&&y===s.y){b.textContent='🧙';b.classList.add('hero')}else b.textContent=seen?(o?o.i:ti):' ';b.addEventListener('click',()=>move(x,y));m.appendChild(b)}renderTown();renderQuest();if(s.battle)renderBattle();persist()}
function move(x,y){if(s.battle)return;let d=Math.abs(x-s.x)+Math.abs(y-s.y);if(d!==1){write('Выбери соседнюю клетку.');return}if(s.moves<1){write('Очки передвижения закончились.');return}let [cl]=terrain(x,y);if(cl==='water'||cl==='rock'){write('Путь непроходим.');return}s.x=x;s.y=y;s.moves--;reveal();let o=s.objs[K(x,y)];if(o)event(o,K(x,y));render()}
function event(o,k){if(['gold','wood','ore','gems'].includes(o.t)){s[o.t]+=o.v;delete s.objs[k];write('Получен ресурс: +'+o.v)}else if(o.t==='mine'){s.mine=true;s.quest.mine=true;delete s.objs[k];write('Шахта захвачена! Теперь +2 руды каждый день.')}else if(o.t==='artifact'){s.atk+=2;delete s.objs[k];write('Найден «'+o.n+'»: атака +2.')}else if(o.t==='shrine'){s.magic++;s.mana+=5;delete s.objs[k];write('Святилище усилило магию.')}else if(o.t==='enemy')startBattle(o,k)}
function power(){return s.pikes*1.2+s.bows*2.3+s.cavs*5+s.atk*5+s.def*2}
function startBattle(e,k){s.battle={e,k,hp:e.hp,round:1,guard:false};$('battle').classList.remove('hidden');renderBattle()}
function renderBattle(){let b=s.battle;if(!b)return;$('round').textContent='Раунд '+b.round;$('battleInfo').textContent=`${b.e.n}: ${Math.max(0,Math.round(b.hp))} HP · Мана ${s.mana}`;let f=$('field');f.innerHTML='';for(let i=0;i<21;i++){let d=document.createElement('div');d.className='hex';if(i===15){d.classList.add('friend');d.textContent='🗡️'}if(i===16){d.classList.add('friend');d.textContent='🏹'}if(i===5){d.classList.add('enemy');d.textContent=b.e.i}f.appendChild(d)}}
function enemyTurn(){let b=s.battle;if(!b)return;let dmg=Math.max(1,Math.round(b.e.p*.12+Math.random()*3-s.def*.5));if(b.guard)dmg=Math.ceil(dmg*.55);b.guard=false;let loss=dmg;while(loss>0&&s.pikes){s.pikes--;loss--}while(loss>0&&s.bows){s.bows--;loss-=2}while(loss>0&&s.cavs){s.cavs--;loss-=4}write(b.e.n+' наносит потери: '+dmg);if(s.pikes+s.bows+s.cavs<=0){alert('Армия разгромлена. Поход начинается заново.');localStorage.removeItem('ash-v2');fresh();return false}return true}
function hit(mult=1){let b=s.battle;if(!b)return;let dmg=Math.round((power()*.22+Math.random()*7)*mult);b.hp-=dmg;write('Армия наносит '+dmg+' урона.');finishOrEnemy()}
function finishOrEnemy(){let b=s.battle;if(b.hp<=0){s.gold+=b.e.r;s.xp+=b.e.xp;if(b.e.boss)s.quest.boss=true;delete s.objs[b.k];write('Победа! +'+b.e.r+' золота, +'+b.e.xp+' опыта.');s.battle=null;$('battle').classList.add('hidden');levelUp();render();return}b.round++;if(enemyTurn())render()}
function levelUp(){while(s.xp>=s.level*100){s.level++;s.atk++;s.def++;s.magic++;s.mana+=5;write('Уровень '+s.level+'! Основные характеристики выросли.')}}
$('attack').onclick=()=>hit(1);$('spell').onclick=()=>{if(!s.battle)return;if(s.mana<4){write('Недостаточно маны.');return}s.mana-=4;s.battle.hp-=18+s.magic*12;write('Огненный шар поражает врага.');finishOrEnemy()};$('defend').onclick=()=>{if(!s.battle)return;s.battle.guard=true;write('Армия занимает оборону.');s.battle.round++;if(enemyTurn())render()};$('retreat').onclick=()=>{if(!s.battle)return;s.gold=Math.max(0,s.gold-250);s.battle=null;$('battle').classList.add('hidden');write('Отступление. Потеряно 250 золота.');render()};
$('end').onclick=()=>{s.day++;s.moves=12;s.gold+=250;if(s.mine)s.ore+=2;s.mana=Math.min(10+s.knowledge*5,s.mana+3);write('Наступил день '+s.day+'. Казна получила 250 золота.');render()};
$('town').onclick=()=>{if(K(s.x,s.y)!=='1,1'){write('Город можно открыть только из Светогорска.');return}$('townPanel').classList.toggle('hidden')};$('save').onclick=()=>{persist();write('Игра сохранена.')};
const buildings={barracks:['🛡️ Казармы',700,3,0],range:['🏹 Стрельбище',900,4,0],stable:['🐎 Конюшни',1400,3,3],mage:['🔮 Гильдия магов',1100,2,2]};
function renderTown(){let box=$('buildings');box.innerHTML='';Object.entries(buildings).forEach(([k,v])=>{let b=document.createElement('button');b.className='building'+(s.build[k]?' built':'');b.innerHTML='<b>'+v[0]+'</b><br><span class=small>'+(s.build[k]?'Построено':`${v[1]}💰 ${v[2]}🪵 ${v[3]}🪨`)+'</span>';b.disabled=s.build[k];b.onclick=()=>{if(s.gold<v[1]||s.wood<v[2]||s.ore<v[3]){write('Не хватает ресурсов.');return}s.gold-=v[1];s.wood-=v[2];s.ore-=v[3];s.build[k]=true;if(k==='mage'){s.magic++;s.mana+=5}write('Построено: '+v[0]);render()};box.appendChild(b)});let r=$('recruits');r.innerHTML='';[['pikes','🗡️ 8 копейщиков',320,'barracks',8],['bows','🏹 5 стрелков',500,'range',5],['cavs','🐎 2 рыцаря',900,'stable',2]].forEach(v=>{let b=document.createElement('button');b.className='building';b.innerHTML='<b>'+v[1]+'</b><br><span class=small>'+v[2]+' золота</span>';b.disabled=!s.build[v[3]];b.onclick=()=>{if(s.gold<v[2]){write('Не хватает золота.');return}s.gold-=v[2];s[v[0]]+=v[4];render()};r.appendChild(b)})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{let build=b.dataset.tab==='build';$('buildPane').classList.toggle('hidden',!build);$('recruitPane').classList.toggle('hidden',build);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('gold',x===b))});
function renderQuest(){$('quests').innerHTML=`<div class=quest>${s.quest.mine?'✅':'⬜'} Захватить железную шахту</div><div class=quest>${s.quest.boss?'✅':'⬜'} Победить Некроманта</div>`+(s.quest.boss?'<div class=quest><b>🏆 Победа! Северные земли освобождены.</b></div>':'')}
if(!restore())fresh();else{reveal();render();write('Сохранение загружено.')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
