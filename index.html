<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Королевства Пепла">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Королевства Пепла IV</title>
<style>
:root{
 --bg:#070907;--panel:#101611;--panel2:#192219;--line:#7d642c;--line2:#394637;
 --gold:#dfb75f;--text:#f5ecd9;--muted:#b9b19f;--red:#874038;--blue:#2d557a;--green:#365b35
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050705;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}.app{max-width:1100px;margin:auto;background:#080b08;min-height:100%}
.top{display:flex;gap:4px;align-items:center;overflow:auto;padding:6px;background:linear-gradient(#171d17,#0c100d);border-bottom:1px solid var(--line)}
.r{white-space:nowrap;border:1px solid #5f502c;background:#171d17;border-radius:5px;padding:5px 7px;font-size:12px}.grow{flex:1}
.screen{display:none}.screen.active{display:block}
.world{height:72vh;min-height:540px;position:relative;overflow:auto;background:#0b0f0b}
.world:before{content:"";position:absolute;inset:0;background:url('world.jpg') center/cover no-repeat;opacity:.34;filter:saturate(.9) brightness(.72)}
.map{position:relative;z-index:1;display:grid;grid-template-columns:repeat(15,58px);grid-auto-rows:58px;gap:1px;padding:9px;width:max-content}
.tile{position:relative;border:0;border-radius:3px;background:rgba(55,79,43,.68);overflow:hidden}
.tile.road{background:rgba(111,93,55,.68)}.tile.water{background:rgba(42,77,88,.76)}.tile.mountain{background:rgba(73,74,67,.76)}
.tile.fog{background:#050705!important}.tile.fog>*{visibility:hidden}.tile.fog:after{content:"";position:absolute;inset:-2px;background:radial-gradient(circle,#111811 0,#050705 70%)}
.tile.reachable{box-shadow:inset 0 0 0 2px rgba(229,190,92,.7)}.tile.selected{outline:3px solid var(--gold);z-index:4}
.obj{position:absolute;inset:4px;border-radius:5px;background-size:cover;background-position:center;box-shadow:0 2px 4px #0008}.obj.hero{background-image:url('hero.jpg');background-position:50% 18%}.obj.enemyHero{background-image:url('necromancer.jpg')}
.obj.castle{background-image:url('castle.jpg')}.obj.mine{background-image:url('mine.jpg')}.obj.sawmill{background-image:url('sawmill.jpg')}.obj.chest{background-image:url('chest.jpg')}.obj.portal{background-image:url('portal.jpg')}
.obj.orc{background-image:url('orc.jpg')}.obj.wolf{background-image:url('wolf.jpg')}.obj.necro{background-image:url('necromancer.jpg')}
.badge{position:absolute;right:1px;bottom:1px;z-index:5;background:#050705dd;border:1px solid #75602e;border-radius:5px;padding:1px 4px;font-size:10px}
.hud{position:absolute;z-index:5;left:8px;right:8px;bottom:8px;display:flex;gap:7px;pointer-events:none}
.hcard{pointer-events:auto;background:#0a0e0bd9;border:1px solid var(--line);border-radius:8px;padding:7px;backdrop-filter:blur(5px)}
.hm{display:grid;grid-template-columns:40px 1fr;gap:6px;min-width:185px}.hm img{width:40px;height:40px;object-fit:cover;border-radius:5px;border:1px solid #886c30}
.progress{height:5px;background:#050705;border-radius:4px;overflow:hidden;margin-top:4px}.progress i{display:block;height:100%;background:var(--gold)}
.hactions{display:flex;gap:5px;margin-left:auto}.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:7px;background:#1a2119;font-size:20px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#0e130f;border-top:1px solid var(--line)}.nav button{min-height:58px;border:0;border-right:1px solid #2c342b;background:#111711;font-size:11px;padding:6px 2px}.nav b{display:block;font-size:21px}.nav button.active{background:#312817;color:#f0ca72}
.panel{margin:8px;border:1px solid var(--line);background:linear-gradient(#1b241b,#0e140f);border-radius:10px;padding:10px}.title{font-size:19px;font-weight:800;margin-bottom:8px}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:8px}.grid{display:grid;gap:7px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.btn{min-height:44px;border:1px solid var(--line);background:#1b241b;border-radius:7px;padding:8px}.btn.gold{background:#57431d}.btn.red{background:#4b2924}.btn:disabled{opacity:.42}
.heroPane{display:grid;grid-template-columns:110px 1fr;gap:10px}.heroPane img{width:110px;height:150px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.unitcard{border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#151d16}.unitcard img{width:100%;height:92px;object-fit:cover;display:block}.unitcard .txt{padding:6px;text-align:center}.unitcard b{display:block;font-size:17px}
.cityArt{height:200px;border:1px solid var(--line);border-radius:8px;background:url('city.jpg') center/cover no-repeat}
.building{position:relative;text-align:left}.built{border-color:#b48f43;background:#332b1b}.lock{position:absolute;right:6px;top:5px}
.skill{border-left:3px solid var(--gold);padding-left:8px;margin:7px 0}.quest{border:1px solid var(--line2);border-radius:7px;padding:8px;margin-bottom:6px}.quest.done{opacity:.6}.log{max-height:190px;overflow:auto;font-size:12px;line-height:1.45}
.modal{position:fixed;inset:0;z-index:30;background:#000d;display:flex;align-items:center;justify-content:center;padding:10px}.modal.hidden{display:none}.dialog{width:min(820px,100%);max-height:94vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0d120e;padding:10px}
.battleArt{position:relative;height:280px;border-radius:8px;overflow:hidden;background:url('battlefield.jpg') center/cover no-repeat;border:1px solid var(--line)}
.bgrid{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:3px}.cell{position:relative;border:1px solid rgba(226,201,111,.28);border-radius:9px;background:rgba(35,49,29,.16)}.cell.move{background:rgba(74,115,64,.32);border-color:#739267}.cell.attack{background:rgba(129,55,45,.33);border-color:#a66050}.cell.sel{outline:2px solid var(--gold)}
.stack{position:absolute;inset:2px;border-radius:8px;background-size:cover;background-position:center;border:1px solid #0009}.stack.player{box-shadow:0 0 0 2px #557d9b}.stack.enemy{box-shadow:0 0 0 2px #9b554b}.stack .qty{position:absolute;right:1px;bottom:1px;background:#050705e8;border-radius:4px;padding:1px 4px;font-size:10px}
.turnbar{display:flex;gap:5px;overflow:auto;margin:8px 0}.turnchip{min-width:50px;border:1px solid var(--line2);background:#161d17;border-radius:7px;padding:4px;text-align:center;font-size:10px}.turnchip.active{border-color:var(--gold)}
.hidden{display:none!important}
@media(min-width:760px){.world{height:75vh}.map{grid-template-columns:repeat(15,66px);grid-auto-rows:66px}.battleArt{height:390px}}
</style>
</head><body><main class="app">
<div class="top"><span class="r">🪙 <b id="gold"></b></span><span class="r">🪵 <b id="wood"></b></span><span class="r">🪨 <b id="ore"></b></span><span class="r">💎 <b id="gems"></b></span><span class="r">🔮 <b id="crystal"></b></span><span class="grow"></span><span class="r">☀️ День <b id="day"></b> · Нед. <b id="week"></b></span></div>

<section class="screen active" id="s-map"><div class="world"><div class="map" id="map"></div>
<div class="hud"><div class="hcard hm"><img src="hero.jpg"><div><b>Арден</b><div class="small">Ур. <span id="lvlm"></span> · армия <span id="pow"></span></div><div class="progress"><i id="mvbar"></i></div></div></div>
<div class="hactions"><button class="ib" id="endDay">⌛</button><button class="ib" id="save">💾</button></div></div></div></section>

<section class="screen" id="s-hero"><div class="panel heroPane"><img src="hero.jpg"><div><div class="title">Арден</div><div class="small">Рыцарь Стального Холма</div><div class="row"><span>Атака</span><b id="atk"></b></div><div class="row"><span>Защита</span><b id="def"></b></div><div class="row"><span>Магия</span><b id="magic"></b></div><div class="row"><span>Знания</span><b id="knowledge"></b></div><div class="small">Ур. <b id="level"></b> · Опыт <b id="xp"></b></div></div></div>
<div class="panel"><div class="title">Армия</div><div class="grid g3" id="army"></div></div>
<div class="panel"><div class="title">Навыки</div><div id="skills"></div></div></section>

<section class="screen" id="s-town"><div class="panel"><div class="cityArt"></div><div class="title" style="margin-top:8px">Стальной Холм</div><div class="small">Еженедельный прирост армии зависит от построек.</div></div><div class="panel"><div class="title">Строительство</div><div class="grid g2" id="buildings"></div></div><div class="panel"><div class="title">Найм</div><div class="grid g3" id="recruits"></div></div></section>

<section class="screen" id="s-magic"><div class="panel"><div class="title">Книга магии</div><div>Мана: <b id="mana"></b>/<b id="manaMax"></b></div></div><div class="panel grid" id="spells"></div></section>

<section class="screen" id="s-quests"><div class="panel"><div class="title">Задания</div><div id="quests"></div></div><div class="panel"><div class="title">Журнал</div><div class="log" id="log"></div></div></section>

<nav class="nav"><button data-s="map" class="active"><b>🗺️</b>Карта</button><button data-s="hero"><b>🛡️</b>Герой</button><button data-s="town"><b>🏰</b>Город</button><button data-s="magic"><b>📖</b>Магия</button><button data-s="quests"><b>📜</b>Задания</button></nav>
</main>

<div class="modal hidden" id="battleModal"><div class="dialog"><div class="row"><div class="title">Битва: <span id="battleName"></span></div><div class="small" id="battleRound"></div></div><div class="turnbar" id="turnbar"></div><div class="battleArt"><div class="bgrid" id="bgrid"></div></div><div class="small" id="battleHint" style="margin-top:6px"></div><div class="grid g2" style="margin-top:8px"><button class="btn gold" id="waitBtn">⏳ Ждать</button><button class="btn" id="defBtn">🛡️ Оборона</button><button class="btn" id="spellBtn">🔥 Огненный шар</button><button class="btn red" id="retreatBtn">Отступить</button></div></div></div>
<div class="modal hidden" id="levelModal"><div class="dialog"><div class="title">Новый уровень</div><div class="small">Выбери навык</div><div class="grid" id="levelChoices" style="margin-top:8px"></div></div></div>

<script>
(()=> {
const $=id=>document.getElementById(id), W=15,H=12,K=(x,y)=>x+','+y;
const units={
 pikes:{n:'Копейщики',img:'pikeman.jpg',p:1.25,hp:9,spd:3,range:1,cost:360,qty:8,req:'barracks'},
 bows:{n:'Стрелки',img:'archer.jpg',p:2.45,hp:7,spd:3,range:4,cost:540,qty:5,req:'range'},
 cavs:{n:'Рыцари',img:'cavalier.jpg',p:5.4,hp:18,spd:5,range:1,cost:980,qty:2,req:'stable'},
 griffins:{n:'Грифоны',img:'griffin.jpg',p:8.8,hp:28,spd:6,range:1,cost:1450,qty:1,req:'griffin'},
 mages:{n:'Маги',img:'mage.jpg',p:10.2,hp:20,spd:4,range:5,cost:1650,qty:1,req:'mage'}
};
const enemies={
 orcs:{n:'Орки',img:'orc.jpg',p:3.2,hp:14,spd:3,range:1},
 wolves:{n:'Волки',img:'wolf.jpg',p:4.0,hp:13,spd:5,range:1},
 skeletons:{n:'Скелеты',img:'skeleton.jpg',p:2.7,hp:10,spd:3,range:1},
 necros:{n:'Некроманты',img:'necromancer.jpg',p:9.5,hp:24,spd:3,range:5}
};
const objs={
 '1,1':{t:'castle',img:'castle'},
 '3,2':{t:'sawmill',img:'sawmill'},
 '6,1':{t:'mine',img:'mine'},
 '8,2':{t:'enemy',img:'orc',name:'Орочий дозор',stacks:[['orcs',12],['wolves',5]],reward:700,xp:65},
 '11,1':{t:'chest',img:'chest'},
 '4,5':{t:'portal',img:'portal'},
 '6,5':{t:'enemy',img:'wolf',name:'Стая кровавых волков',stacks:[['wolves',12],['orcs',7]],reward:950,xp:90},
 '10,6':{t:'chest',img:'chest'},
 '12,8':{t:'enemy',img:'necro',name:'Армия Морвейна',stacks:[['necros',6],['skeletons',22],['orcs',10]],reward:2400,xp:220,boss:true}
};
const builds={
 barracks:{n:'Казармы',cost:[800,3,0],req:null},range:{n:'Стрельбище',cost:[1000,4,0],req:'barracks'},stable:{n:'Конюшни',cost:[1500,3,3],req:'barracks'},griffin:{n:'Башня грифонов',cost:[2200,5,4],req:'stable'},mage:{n:'Гильдия магов',cost:[1800,4,3],req:'range'}
};
const skillDefs={logistics:['Логистика','+2 движения'],leadership:['Лидерство','+10% силы армии'],archery:['Стрельба','+15% урона стрелков'],wisdom:['Мудрость','+5 маны'],estates:['Поместья','+150 золота/день'],resistance:['Сопротивление','-10% входящего урона']};
let s, selectedMap=null;
function fresh(){
 s={x:1,y:1,ex:12,ey:9,gold:2600,wood:12,ore:9,gems:3,crystal:2,day:1,week:1,moves:12,maxMoves:12,atk:2,def:2,magic:1,knowledge:1,level:1,xp:0,mana:14,manaMax:14,
 pikes:24,bows:10,cavs:0,griffins:0,mages:0,seen:[],objects:JSON.parse(JSON.stringify(objs)),build:{barracks:false,range:false,stable:false,griffin:false,mage:false},avail:{pikes:16,bows:0,cavs:0,griffins:0,mages:0},skills:{},mines:{wood:false,ore:false},q:{wood:false,ore:false,boss:false},logs:[],battle:null};
 reveal();log('Арден покидает Стальной Холм. Морвейн укрепляется на востоке.');render()
}
function save(){localStorage.setItem('ash-v4',JSON.stringify(s))}
function load(){try{let x=JSON.parse(localStorage.getItem('ash-v4'));if(x){s=x;return true}}catch(e){}return false}
function log(t){s.logs.unshift('• '+t);s.logs=s.logs.slice(0,60)}
function reveal(){let a=new Set(s.seen);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){let x=s.x+dx,y=s.y+dy;if(x>=0&&y>=0&&x<W&&y<H)a.add(K(x,y))}s.seen=[...a]}
function terrain(x,y){if((y===4&&x>8)||(y===8&&x<3))return 'water';if((x===7&&y>7)||(x===0&&y<4))return 'mountain';if((x===1&&y<8)||(y===5&&x<11))return 'road';return ''}
function pow(){let p=s.pikes*units.pikes.p+s.bows*units.bows.p+s.cavs*units.cavs.p+s.griffins*units.griffins.p+s.mages*units.mages.p+s.atk*5+s.def*2;if(s.skills.leadership)p*=1.1;if(s.skills.archery)p+=s.bows*units.bows.p*.15;return p}
function render(){
 ['gold','wood','ore','gems','crystal','day','week','atk','def','magic','knowledge','level','xp','mana','manaMax'].forEach(k=>$(k).textContent=s[k]);
 $('lvlm').textContent=s.level;$('pow').textContent=Math.round(pow());$('mvbar').style.width=Math.max(0,Math.min(100,s.moves/s.maxMoves*100))+'%';
 renderMap();renderHero();renderTown();renderMagic();renderQuests();save()
}
function renderMap(){
 let m=$('map');m.innerHTML='';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let b=document.createElement('button');let seen=s.seen.includes(K(x,y)),t=terrain(x,y),o=s.objects[K(x,y)];
  b.className='tile'+(t?' '+t:'')+(seen?'':' fog');
  let div=null;
  if(x===s.x&&y===s.y){div=document.createElement('span');div.className='obj hero';b.classList.add('selected')}
  else if(seen&&x===s.ex&&y===s.ey&&!s.q.boss){div=document.createElement('span');div.className='obj enemyHero'}
  else if(seen&&o){div=document.createElement('span');div.className='obj '+o.img;if(o.t==='enemy'){let badge=document.createElement('span');badge.className='badge';badge.textContent=o.stacks.reduce((a,v)=>a+v[1],0);b.appendChild(badge)}}
  if(div)b.appendChild(div);
  if(selectedMap&&Math.abs(x-s.x)+Math.abs(y-s.y)===1)b.classList.add('reachable');
  b.onclick=()=>mapTap(x,y);m.appendChild(b)
 }
}
function mapTap(x,y){
 let d=Math.abs(x-s.x)+Math.abs(y-s.y);
 if(d===1){move(x,y);selectedMap=null}else{selectedMap={x,y};log(d===0?'Арден готов к походу.':'Для дальнего пути двигайся по соседним клеткам.');renderMap();renderQuests()}
}
function move(x,y){
 if(s.battle||s.moves<=0){log('Невозможно двигаться.');return}
 let t=terrain(x,y);if(t==='water'||t==='mountain'){log('Путь непроходим.');return}
 s.x=x;s.y=y;s.moves--;reveal();let o=s.objects[K(x,y)];if(o)event(o,K(x,y));render()
}
function event(o,k){
 if(o.t==='sawmill'){s.mines.wood=true;s.q.wood=true;delete s.objects[k];log('Лесопилка захвачена: +2 дерева каждый день.')}
 else if(o.t==='mine'){s.mines.ore=true;s.q.ore=true;delete s.objects[k];log('Железная шахта захвачена: +2 руды каждый день.')}
 else if(o.t==='chest'){delete s.objects[k];if(Math.random()<.5){s.gold+=1000;log('Сундук: +1000 золота.')}else{s.xp+=85;log('Сундук знаний: +85 опыта.');checkLevel()}}
 else if(o.t==='portal'){s.mana=Math.min(s.manaMax,s.mana+6);delete s.objects[k];log('Камень маны восстановил 6 маны.')}
 else if(o.t==='enemy')startBattle(o,k)
}
function nextDay(){
 s.day++;if(s.day%7===1){s.week++;for(let k in units)if(s.build[units[k].req])s.avail[k]+=({pikes:16,bows:10,cavs:4,griffins:2,mages:2})[k];log('Новая неделя: в городе появился прирост существ.')}
 s.maxMoves=12+(s.skills.logistics?2:0);s.moves=s.maxMoves;s.gold+=300+(s.skills.estates?150:0);if(s.mines.wood)s.wood+=2;if(s.mines.ore)s.ore+=2;s.mana=Math.min(s.manaMax,s.mana+3+s.knowledge);enemyAI();render()
}
function enemyAI(){if(s.q.boss)return;let dx=Math.sign(s.x-s.ex),dy=Math.sign(s.y-s.ey);if(Math.random()<.55)s.ex=Math.max(0,Math.min(W-1,s.ex+dx));else s.ey=Math.max(0,Math.min(H-1,s.ey+dy));if(Math.abs(s.ex-s.x)+Math.abs(s.ey-s.y)<=2)log('Разведчики сообщают: Морвейн совсем близко.')}
function renderHero(){
 let box=$('army');box.innerHTML='';for(let k in units){let u=units[k],c=document.createElement('div');c.className='unitcard';c.innerHTML=`<img src="${u.img}"><div class=txt><b>${s[k]}</b><span class=small>${u.n}</span></div>`;box.appendChild(c)}
 $('skills').innerHTML=Object.keys(s.skills).length?Object.keys(s.skills).map(k=>`<div class=skill><b>${skillDefs[k][0]}</b><div class=small>${skillDefs[k][1]}</div></div>`).join(''):'<div class=small>Навыки появятся при повышении уровня.</div>'
}
function renderTown(){
 let b=$('buildings');b.innerHTML='';for(let k in builds){let d=builds[k],x=document.createElement('button');x.className='btn building'+(s.build[k]?' built':'');let locked=d.req&&!s.build[d.req];x.innerHTML=`<b>${d.n}</b><br><span class=small>${s.build[k]?'Построено':`${d.cost[0]}🪙 ${d.cost[1]}🪵 ${d.cost[2]}🪨`}</span>${locked?'<span class=lock>🔒</span>':''}`;x.disabled=s.build[k]||locked;x.onclick=()=>build(k);b.appendChild(x)}
 let r=$('recruits');r.innerHTML='';for(let k in units){let u=units[k],x=document.createElement('button');x.className='unitcard';let on=s.build[u.req];x.innerHTML=`<img src="${u.img}"><div class=txt><b>${u.n}</b><span class=small>${on?`Доступно ${s.avail[k]} · ${u.qty} за ${u.cost}🪙`:'Нужно здание'}</span></div>`;x.disabled=!on||s.avail[k]<u.qty;x.onclick=()=>recruit(k);r.appendChild(x)}
}
function build(k){let d=builds[k];if(s.gold<d.cost[0]||s.wood<d.cost[1]||s.ore<d.cost[2]){log('Не хватает ресурсов.');renderQuests();return}s.gold-=d.cost[0];s.wood-=d.cost[1];s.ore-=d.cost[2];s.build[k]=true;for(let u in units)if(units[u].req===k)s.avail[u]+=({pikes:16,bows:10,cavs:4,griffins:2,mages:2})[u];if(k==='mage'){s.magic++;s.manaMax+=5;s.mana=s.manaMax}log('Построено: '+d.n);render()}
function recruit(k){let u=units[k];if(s.gold<u.cost)return;s.gold-=u.cost;s[k]+=u.qty;s.avail[k]-=u.qty;log(`Наняты ${u.n}: +${u.qty}`);render()}
function renderMagic(){$('spells').innerHTML=`<div class=panel><b>🔥 Огненный шар</b><div class=small>4 маны · урон по выбранному вражескому отряду</div></div><div class=panel><b>⚡ Молния</b><div class=small>6 маны · сильный одиночный урон</div></div><div class=panel><b>🛡️ Каменная кожа</b><div class=small>4 маны · защита активного отряда</div></div>`}
function renderQuests(){$('quests').innerHTML=[['wood','Захватить лесопилку'],['ore','Захватить железную шахту'],['boss','Победить Морвейна']].map(([k,n])=>`<div class="quest ${s.q[k]?'done':''}">${s.q[k]?'✅':'⬜'} <b>${n}</b></div>`).join('');$('log').innerHTML=s.logs.map(x=>`<div>${x}</div>`).join('')}
function checkLevel(){let need=s.level*100;if(s.xp>=need){s.level++;s.atk++;s.def++;let keys=Object.keys(skillDefs).filter(k=>!s.skills[k]).sort(()=>Math.random()-.5).slice(0,2),box=$('levelChoices');box.innerHTML='';keys.forEach(k=>{let bt=document.createElement('button');bt.className='btn';bt.innerHTML=`<b>${skillDefs[k][0]}</b><br><span class=small>${skillDefs[k][1]}</span>`;bt.onclick=()=>{s.skills[k]=1;if(k==='logistics'){s.maxMoves+=2;s.moves+=2}if(k==='wisdom'){s.manaMax+=5;s.mana+=5}$('levelModal').classList.add('hidden');render()};box.appendChild(bt)});$('levelModal').classList.remove('hidden')}}
function startBattle(o,k){
 let ps=[];[['pikes',s.pikes],['bows',s.bows],['cavs',s.cavs],['griffins',s.griffins],['mages',s.mages]].forEach(([u,q],i)=>{if(q)ps.push({side:'p',type:u,qty:q,hp:q*units[u].hp,x:0,y:i})});
 let es=o.stacks.map((v,i)=>({side:'e',type:v[0],qty:v[1],hp:v[1]*enemies[v[0]].hp,x:7,y:i+1}));
 let all=[...ps,...es];all.sort((a,b)=>(b.side==='p'?units[b.type].spd:enemies[b.type].spd)-(a.side==='p'?units[a.type].spd:enemies[a.type].spd));
 s.battle={o,k,stacks:[...ps,...es],order:all.map(a=>({side:a.side,type:a.type})),turn:0,round:1,selected:null};$('battleModal').classList.remove('hidden');battleTurn()
}
function bdef(st){return st.side==='p'?units[st.type]:enemies[st.type]}
function findStack(key){let [side,type]=key.split(':');return s.battle.stacks.find(z=>z.side===side&&z.type===type&&z.qty>0)}
function battleTurn(){
 let b=s.battle;if(!b)return;b.stacks=b.stacks.filter(z=>z.qty>0&&z.hp>0);let p=b.stacks.some(z=>z.side==='p'),e=b.stacks.some(z=>z.side==='e');if(!p||!e){finishBattle(p);return}
 let guard=0;while(guard++<30){if(b.turn>=b.order.length){b.turn=0;b.round++;b.order=b.stacks.slice().sort((a,c)=>bdef(c).spd-bdef(a).spd).map(a=>({side:a.side,type:a.type}))}
 let key=b.order[b.turn++],st=findStack(key.side+':'+key.type);if(st){b.selected=st;break}}
 renderBattle();if(b.selected&&b.selected.side==='e')setTimeout(enemyBattleAI,350)
}
function renderBattle(){
 let b=s.battle;if(!b)return;$('battleName').textContent=b.o.name;$('battleRound').textContent='Раунд '+b.round;$('battleHint').textContent=b.selected?.side==='p'?'Выбери подсвеченную клетку для движения или вражеский отряд для атаки.':'Ход противника…';
 let tb=$('turnbar');tb.innerHTML='';b.order.forEach((k,i)=>{let st=findStack(k.side+':'+k.type);if(!st)return;let c=document.createElement('div');c.className='turnchip'+(st===b.selected?' active':'');c.textContent=(st.side==='p'?'🟦 ':'🟥 ')+bdef(st).n;tb.appendChild(c)});
 let g=$('bgrid');g.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<8;x++){let c=document.createElement('button');c.className='cell';let active=b.selected,dist=active?Math.abs(x-active.x)+Math.abs(y-active.y):99,occupied=b.stacks.find(z=>z.x===x&&z.y===y&&z.qty>0);
 if(active?.side==='p'&&!occupied&&dist<=bdef(active).spd)c.classList.add('move');if(active?.side==='p'&&occupied?.side==='e'&&dist<=bdef(active).range)c.classList.add('attack');if(occupied===active)c.classList.add('sel');
 if(occupied){let st=document.createElement('span');st.className='stack '+(occupied.side==='p'?'player':'enemy');st.style.backgroundImage=`url('${bdef(occupied).img}')`;let q=document.createElement('span');q.className='qty';q.textContent=occupied.qty;st.appendChild(q);c.appendChild(st)}
 c.onclick=()=>battleCell(x,y,occupied);g.appendChild(c)}
}
function battleCell(x,y,occ){let b=s.battle,a=b.selected;if(!a||a.side!=='p')return;let d=Math.abs(x-a.x)+Math.abs(y-a.y),def=bdef(a);if(occ&&occ.side==='e'&&d<=def.range){strike(a,occ);battleTurn()}else if(!occ&&d<=def.spd){a.x=x;a.y=y;renderBattle();setTimeout(battleTurn,120)}}
function strike(a,t){let ad=bdef(a),td=bdef(t),base=a.qty*ad.p*(1+s.atk*.04);if(a.side==='p'&&a.type==='bows'&&s.skills.archery)base*=1.15;let dmg=Math.max(1,Math.round(base*(.78+Math.random()*.35)));t.hp-=dmg;t.qty=Math.max(0,Math.ceil(t.hp/td.hp));log(`${ad.n} наносят ${dmg} урона.`)}
function enemyBattleAI(){let b=s.battle,a=b.selected;if(!a||a.side!=='e')return;let targets=b.stacks.filter(z=>z.side==='p'&&z.qty>0).sort((u,v)=>(Math.abs(u.x-a.x)+Math.abs(u.y-a.y))-(Math.abs(v.x-a.x)+Math.abs(v.y-a.y)));let t=targets[0];if(!t){battleTurn();return}let d=Math.abs(t.x-a.x)+Math.abs(t.y-a.y),ad=bdef(a);if(d<=ad.range){strike(a,t);battleTurn();return}let dx=Math.sign(t.x-a.x),dy=Math.sign(t.y-a.y);for(let step=0;step<ad.spd;step++){let nx=a.x+(Math.abs(t.x-a.x)>=Math.abs(t.y-a.y)?dx:0),ny=a.y+(Math.abs(t.x-a.x)<Math.abs(t.y-a.y)?dy:0);if(nx<0||nx>7||ny<0||ny>4||b.stacks.some(z=>z!==a&&z.x===nx&&z.y===ny&&z.qty>0))break;a.x=nx;a.y=ny}battleTurn()}
function finishBattle(win){
 let b=s.battle;if(win){s.gold+=b.o.reward;s.xp+=b.o.xp;if(b.o.boss){s.q.boss=true;s.ex=-1;s.ey=-1}delete s.objects[b.k];syncArmyFromBattle();log(`Победа! +${b.o.reward} золота, +${b.o.xp} опыта.`);checkLevel()}else{alert('Армия разгромлена. Поход начинается заново.');localStorage.removeItem('ash-v4');$('battleModal').classList.add('hidden');fresh();return}
 s.battle=null;$('battleModal').classList.add('hidden');render()
}
function syncArmyFromBattle(){for(let k in units)s[k]=0;s.battle.stacks.filter(z=>z.side==='p').forEach(z=>s[z.type]=z.qty)}
$('waitBtn').onclick=()=>{if(s.battle?.selected?.side==='p')battleTurn()};$('defBtn').onclick=()=>{let a=s.battle?.selected;if(a?.side==='p'){a.hp+=Math.ceil(bdef(a).hp*.15);battleTurn()}};
$('spellBtn').onclick=()=>{let b=s.battle,a=b?.selected;if(!a||a.side!=='p'||s.mana<4)return;let enemiesNow=b.stacks.filter(z=>z.side==='e'&&z.qty>0);if(!enemiesNow.length)return;let t=enemiesNow.sort((u,v)=>u.qty-v.qty)[0];s.mana-=4;t.hp-=28+s.magic*14;t.qty=Math.max(0,Math.ceil(t.hp/bdef(t).hp));log('Огненный шар поражает '+bdef(t).n+'.');battleTurn()};
$('retreatBtn').onclick=()=>{if(!s.battle)return;s.gold=Math.max(0,s.gold-350);syncArmyFromBattle();s.battle=null;$('battleModal').classList.add('hidden');log('Арден отступил. Потеряно 350 золота.');render()};
$('endDay').onclick=nextDay;$('save').onclick=()=>{save();log('Игра сохранена.');renderQuests()};
document.querySelectorAll('.nav button').forEach(bt=>bt.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('s-'+bt.dataset.s).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===bt))});
if(!load())fresh();else{reveal();log('Сохранение 4.0 загружено.');render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
