<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1f241d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Королевства Пепла">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Королевства Пепла</title>
  <style>
    :root{
      --bg:#151912;--panel:#22291e;--card:#2c3427;--border:#475240;
      --text:#f1ead8;--muted:#bdb5a4;--accent:#c59b48;--danger:#a95b4e;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 14px)}
    button{font:inherit;color:inherit}
    .app{max-width:980px;margin:auto}
    .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .pill{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:14px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
    @media(min-width:760px){.layout{grid-template-columns:minmax(0,1fr) 280px}}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px}
    .map-wrap{overflow:auto}
    .map{display:grid;grid-template-columns:repeat(10,minmax(30px,1fr));gap:4px;min-width:350px}
    .tile{aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:21px;min-width:0}
    .tile.fog{opacity:.28}
    .tile.hero{outline:2px solid var(--accent)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .btn{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:11px 13px;min-height:44px}
    .btn.primary{background:#43361d;border-color:#806735}
    .btn.danger{background:#452924;border-color:#754238}
    .section-title{font-weight:700;margin-bottom:8px}
    .stats{display:grid;gap:6px;font-size:14px}
    .row{display:flex;justify-content:space-between;gap:10px}
    .log{max-height:170px;overflow:auto;font-size:13px;line-height:1.35}
    .town,.battle{margin-top:10px}
    .hidden{display:none}
    .shop{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:560px){.shop{grid-template-columns:repeat(3,1fr)}}
    .shop .btn{text-align:left}
    .muted{color:var(--muted);font-size:13px}
    .battle-grid{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:560px){.battle-grid{grid-template-columns:1fr 1fr}}
    .battle-unit{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
    .footer{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill">💰 <b id="gold">1200</b></div>
    <div class="pill">🪵 <b id="wood">8</b></div>
    <div class="pill">🪨 <b id="stone">6</b></div>
    <div class="pill">⚡ <b id="moves">8</b></div>
    <div class="pill">⭐ Ур. <b id="level">1</b></div>
  </div>

  <div class="layout">
    <section>
      <div class="panel map-wrap">
        <div id="map" class="map" aria-label="Карта мира"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="endTurn">Завершить ход</button>
        <button class="btn" id="visitTown">Открыть замок</button>
        <button class="btn danger" id="restart">Новая игра</button>
      </div>

      <div class="panel town hidden" id="townPanel">
        <div class="section-title">🏰 Замок Светогорск</div>
        <div class="shop">
          <button class="btn" data-buy="peasants"><b>Ополченцы ×5</b><br><span class="muted">250 золота</span></button>
          <button class="btn" data-buy="archers"><b>Стрелки ×3</b><br><span class="muted">420 золота + 1 дерево</span></button>
          <button class="btn" data-buy="riders"><b>Всадники ×2</b><br><span class="muted">700 золота + 1 камень</span></button>
        </div>
      </div>

      <div class="panel battle hidden" id="battlePanel">
        <div class="row"><div class="section-title">⚔️ Битва</div><div id="battleRound" class="muted"></div></div>
        <div class="battle-grid">
          <div class="battle-unit"><b>Твоя армия</b><div id="playerPower" class="muted"></div></div>
          <div class="battle-unit"><b>Противник</b><div id="enemyPower" class="muted"></div></div>
        </div>
        <div class="controls">
          <button class="btn primary" id="battleAttack">Атаковать</button>
          <button class="btn" id="battleSpell">🔥 Огненная стрела</button>
          <button class="btn danger" id="battleRetreat">Отступить</button>
        </div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <div class="section-title">Герой — Арден</div>
        <div class="stats">
          <div class="row"><span>⚔️ Атака</span><b id="atk">2</b></div>
          <div class="row"><span>🛡️ Защита</span><b id="def">1</b></div>
          <div class="row"><span>🧠 Магия</span><b id="power">1</b></div>
          <div class="row"><span>📜 Опыт</span><b id="xp">0</b></div>
        </div>
      </div>

      <div class="panel" style="margin-top:10px">
        <div class="section-title">Армия</div>
        <div class="stats">
          <div class="row"><span>🗡️ Ополченцы</span><b id="peasants">18</b></div>
          <div class="row"><span>🏹 Стрелки</span><b id="archers">7</b></div>
          <div class="row"><span>🐎 Всадники</span><b id="riders">0</b></div>
        </div>
      </div>

      <div class="panel" style="margin-top:10px">
        <div class="section-title">Журнал</div>
        <div id="log" class="log" aria-live="polite"></div>
      </div>
    </aside>
  </div>

  <div class="footer">Королевства Пепла · PWA-версия</div>
</div>

<script>
(() => {
  const W=10,H=8;
  const terrain=['🌲','🌿','🌿','🪨','🌿','🌲','🌿','🌿','🌲','🌿'];
  const initialObjects={
    '1,1':{t:'town',icon:'🏰',name:'Светогорск'},
    '3,1':{t:'gold',icon:'💰',amount:450},
    '5,2':{t:'enemy',icon:'👹',name:'Гоблины',power:22,reward:600,xp:45},
    '8,1':{t:'artifact',icon:'🗡️',name:'Клинок Пепла',atk:1},
    '2,5':{t:'wood',icon:'🪵',amount:4},
    '6,5':{t:'enemy',icon:'💀',name:'Скелеты',power:34,reward:900,xp:70},
    '8,6':{t:'stone',icon:'🪨',amount:4},
    '4,6':{t:'shrine',icon:'🔮',name:'Святилище',power:1}
  };
  const $=id=>document.getElementById(id);
  let state;

  function save(){ localStorage.setItem('ash-kingdoms-save', JSON.stringify({...state,fog:[...state.fog]})); }
  function load(){
    const raw=localStorage.getItem('ash-kingdoms-save');
    if(!raw)return false;
    try{
      const s=JSON.parse(raw); s.fog=new Set(s.fog||[]); state=s; return true;
    }catch(e){return false}
  }
  function log(t){const d=document.createElement('div');d.textContent='• '+t;$('log').prepend(d)}
  function key(x,y){return x+','+y}
  function reveal(){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=state.x+dx,y=state.y+dy;if(x>=0&&y>=0&&x<W&&y<H)state.fog.add(key(x,y));}}
  function reset(){
    state={x:1,y:1,moves:8,gold:1200,wood:8,stone:6,atk:2,def:1,power:1,xp:0,level:1,peasants:18,archers:7,riders:0,objects:JSON.parse(JSON.stringify(initialObjects)),fog:new Set(),battle:null};
    reveal(); $('townPanel').classList.add('hidden'); $('battlePanel').classList.add('hidden'); $('log').innerHTML=''; log('Арден начинает путь из Светогорска.'); render(); save();
  }
  function render(){
    ['gold','wood','stone','moves','atk','def','power','xp','level','peasants','archers','riders'].forEach(k=>$(k).textContent=state[k]);
    const m=$('map');m.innerHTML='';
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const b=document.createElement('button');b.type='button';b.className='tile';
      const seen=state.fog.has(key(x,y));if(!seen)b.classList.add('fog');
      const obj=state.objects[key(x,y)];
      b.textContent=!seen?'❔':(x===state.x&&y===state.y?'🧙':obj?obj.icon:terrain[(x*3+y*7)%terrain.length]);
      if(x===state.x&&y===state.y)b.classList.add('hero');
      b.addEventListener('click',()=>moveTo(x,y));m.appendChild(b);
    }
    if(state.battle)renderBattle();
    save();
  }
  function moveTo(x,y){
    if(state.battle)return;
    const dist=Math.abs(x-state.x)+Math.abs(y-state.y);
    if(dist!==1){log('Можно идти только на соседнюю клетку.');return}
    if(state.moves<=0){log('Ходы закончились. Заверши ход.');return}
    state.x=x;state.y=y;state.moves--;reveal();
    const obj=state.objects[key(x,y)]; if(obj)resolveObject(obj,key(x,y)); render();
  }
  function resolveObject(o,k){
    if(o.t==='gold'){state.gold+=o.amount;delete state.objects[k];log('Найдено золото: +'+o.amount+'.')}
    if(o.t==='wood'){state.wood+=o.amount;delete state.objects[k];log('Собрано дерево: +'+o.amount+'.')}
    if(o.t==='stone'){state.stone+=o.amount;delete state.objects[k];log('Собран камень: +'+o.amount+'.')}
    if(o.t==='artifact'){state.atk+=o.atk;delete state.objects[k];log('Получен артефакт «'+o.name+'». Атака +'+o.atk+'.')}
    if(o.t==='shrine'){state.power+=o.power;delete state.objects[k];log('Святилище усилило магию: +'+o.power+'.')}
    if(o.t==='town'){log('Ты у ворот Светогорска. Можно открыть замок.')}
    if(o.t==='enemy')startBattle(o,k);
  }
  function armyPower(){return state.peasants*1+state.archers*2.2+state.riders*4.5+state.atk*5+state.def*2}
  function startBattle(enemy,k){state.battle={enemy,key:k,hp:enemy.power*5,max:enemy.power*5,round:1};$('battlePanel').classList.remove('hidden');log('Началась битва: '+enemy.name+'.');renderBattle()}
  function renderBattle(){
    const b=state.battle;if(!b)return;
    $('battleRound').textContent='Раунд '+b.round;
    $('playerPower').textContent='Сила: '+Math.round(armyPower())+' | '+state.peasants+' / '+state.archers+' / '+state.riders;
    $('enemyPower').textContent=b.enemy.name+' — '+Math.max(0,Math.round(b.hp))+' HP';
  }
  function enemyHit(){
    const b=state.battle;if(!b)return;
    const dmg=Math.max(1,Math.round(b.enemy.power*0.08+Math.random()*3-state.def*.6));
    let left=dmg;
    while(left>0&&state.peasants>0){state.peasants--;left--}
    while(left>0&&state.archers>0){state.archers--;left-=2}
    while(left>0&&state.riders>0){state.riders--;left-=4}
    log(b.enemy.name+' наносит потери примерно на '+dmg+' силы.');
    if(state.peasants+state.archers+state.riders<=0){log('Армия разгромлена.');setTimeout(reset,400);return false}
    return true;
  }
  function playerAttack(mult=1){
    const b=state.battle;if(!b)return;
    const dmg=Math.round((armyPower()*0.23+Math.random()*5)*mult);b.hp-=dmg;log('Ты наносишь '+dmg+' урона.');
    if(b.hp<=0){state.gold+=b.enemy.reward;state.xp+=b.enemy.xp;delete state.objects[b.key];log('Победа! +'+b.enemy.reward+' золота, +'+b.enemy.xp+' опыта.');state.battle=null;$('battlePanel').classList.add('hidden');levelCheck();render();return}
    b.round++;if(enemyHit())render();
  }
  function levelCheck(){while(state.xp>=state.level*80){state.level++;state.atk++;state.def++;log('Новый уровень '+state.level+': атака и защита +1.')}}
  $('battleAttack').addEventListener('click',()=>playerAttack(1));
  $('battleSpell').addEventListener('click',()=>{
    if(!state.battle)return;
    const dmg=10+state.power*8;state.battle.hp-=dmg;log('Огненная стрела наносит '+dmg+' урона.');
    if(state.battle.hp<=0){playerAttack(0);return}
    state.battle.round++;if(enemyHit())render();
  });
  $('battleRetreat').addEventListener('click',()=>{if(!state.battle)return;log('Арден отступает. Потеряно 200 золота.');state.gold=Math.max(0,state.gold-200);state.battle=null;$('battlePanel').classList.add('hidden');render()});
  $('endTurn').addEventListener('click',()=>{state.moves=8;state.gold+=100;log('Новый день. Доход королевства: +100 золота.');render()});
  $('visitTown').addEventListener('click',()=>{const onTown=state.objects[key(state.x,state.y)]?.t==='town';if(!onTown){log('Чтобы открыть замок, встань на клетку 🏰.');return}$('townPanel').classList.toggle('hidden')});
  document.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>{
    const t=btn.dataset.buy;
    if(t==='peasants'){if(state.gold<250){log('Не хватает золота.');return}state.gold-=250;state.peasants+=5;log('Нанято 5 ополченцев.')}
    if(t==='archers'){if(state.gold<420||state.wood<1){log('Не хватает ресурсов.');return}state.gold-=420;state.wood--;state.archers+=3;log('Нанято 3 стрелка.')}
    if(t==='riders'){if(state.gold<700||state.stone<1){log('Не хватает ресурсов.');return}state.gold-=700;state.stone--;state.riders+=2;log('Нанято 2 всадника.')}
    render();
  }));
  $('restart').addEventListener('click',()=>{localStorage.removeItem('ash-kingdoms-save');reset()});
  if(!load())reset(); else {reveal();render();log('Сохранение загружено.')}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
